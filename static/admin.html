<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
        button.danger { background: #dc3545; }
        button.success { background: #28a745; }
        .nav-bar { margin-bottom: 20px; }
        .btn-primary { background: #007bff; }
    </style>
</head>
<body>
<div class="admin-container">
    <h1>Админ-панель</h1>
    <div id="stats"></div>
    <h2>Пользователи</h2>
    <button id="refreshUsers">Обновить</button>
    <table id="usersTable">
        <thead>
            <tr><th>ID</th><th>Email</th><th>Роль</th><th>Действия</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <h2>Анализы товаров</h2>
    <button id="refreshProducts">Обновить</button>
    <table id="productsTable">
        <thead>
            <tr><th>ID</th><th>Пользователь</th><th>Товар ID</th><th>Отзывов</th><th>Дата</th><th>Действия</th></tr>
        </thead>
        <tbody></tbody>
    </table>
    <button id="backToSite">На главную</button>
    <button id="logoutBtn">Выйти</button>
</div>

<!-- Подключаем модульную точку входа для админки -->
<script type="module" src="/static/admin-app.js"></script>
</body>
</html>
